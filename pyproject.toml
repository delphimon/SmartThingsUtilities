[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartthings-utilities"
version = "0.1.0"
description = "Read-only command-line utilities for SmartThings inventory and diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Andrew Kass" }
]
dependencies = []

[project.scripts]
smartthings-utils = "smartthings_utilities.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
